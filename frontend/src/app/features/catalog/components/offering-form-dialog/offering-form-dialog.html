<app-modal-dialog [heading]="heading()" (closed)="cancelled.emit()">
  <form class="stack-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="field">
      <label for="offering-category">Categoría</label>
      <select
        id="offering-category"
        formControlName="categoryId"
        [attr.aria-invalid]="isInvalid('categoryId')"
        [attr.aria-describedby]="isInvalid('categoryId') ? 'offering-category-error' : null"
      >
        <option [ngValue]="null" disabled>Elegí una categoría</option>
        @for (category of categories(); track category.id) {
          <option [ngValue]="category.id">{{ category.name }}{{ category.active ? '' : ' (inactiva)' }}</option>
        }
      </select>
      @if (isInvalid('categoryId')) {
        <p class="field-error" id="offering-category-error">Elegí una categoría.</p>
      }
    </div>

    <div class="field">
      <label for="offering-name">Nombre</label>
      <input
        id="offering-name"
        type="text"
        formControlName="name"
        maxlength="150"
        autocomplete="off"
        [attr.aria-invalid]="isInvalid('name')"
        [attr.aria-describedby]="isInvalid('name') ? 'offering-name-error' : null"
      />
      @if (isInvalid('name')) {
        <p class="field-error" id="offering-name-error">Ingresá el nombre del servicio.</p>
      }
    </div>

    <div class="field">
      <label for="offering-description">Descripción <span class="field-hint">(opcional)</span></label>
      <textarea id="offering-description" formControlName="description" maxlength="2000"></textarea>
    </div>

    <div class="field">
      <label for="offering-price">Precio</label>
      <input
        id="offering-price"
        type="number"
        inputmode="decimal"
        min="0"
        step="0.01"
        formControlName="price"
        [attr.aria-invalid]="isInvalid('price')"
        [attr.aria-describedby]="isInvalid('price') ? 'offering-price-error' : null"
      />
      @if (isInvalid('price')) {
        <p class="field-error" id="offering-price-error">Ingresá un precio válido (0 o más).</p>
      }
    </div>

    <label class="switch">
      <input type="checkbox" role="switch" formControlName="bookable" />
      Se puede reservar desde la página de turnos
    </label>

    @if (errorMessage(); as error) {
      <p class="form-error" role="alert">{{ error }}</p>
    }

    <div class="form-actions">
      <button class="btn" type="button" (click)="cancelled.emit()">Cancelar</button>
      <button class="btn btn-primary" type="submit" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Guardando...' : 'Guardar' }}
      </button>
    </div>
  </form>
</app-modal-dialog>
