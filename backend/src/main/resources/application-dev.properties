# Development: creates the database if missing, verbose logging
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:esthetiadmin}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Buenos_Aires
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# Development-only defaults; real values come from .env
app.security.jwt.secret=${JWT_SECRET:dev-only-secret-do-not-use-in-production-0123456789}
app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:dev-password-123}

spring.jpa.show-sql=true
logging.level.com.esthetiadmin=DEBUG
