spring.application.name=backend

# Active profile: dev by default, prod on the VPS (SPRING_PROFILES_ACTIVE=prod)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Loads backend/.env when present (local development)
spring.config.import=optional:file:.env[.properties]

# Common settings: the schema is owned by Flyway, Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Appointment emails (ADR 016): any SMTP server. Off unless MAIL_ENABLED=true
app.notifications.email.enabled=${MAIL_ENABLED:false}
app.notifications.email.from=${MAIL_FROM:no-reply@localhost}
app.notifications.email.panel-url=${PANEL_URL:http://localhost:4200}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL:false}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Thymeleaf is only used for the email templates, never for web pages
spring.thymeleaf.check-template-location=false
