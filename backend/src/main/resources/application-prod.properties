# Production: no defaults, the app fails to start if a variable is missing.
# The database must already exist; the user needs only DML/DDL rights on it.
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=America/Argentina/Buenos_Aires
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}

spring.jpa.show-sql=false
logging.level.root=INFO
logging.level.com.esthetiadmin=INFO

# API documentation is only available in development
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Never leak internals in error responses
server.error.include-stacktrace=never
server.error.include-message=never

# Behind nginx: take the client IP from X-Forwarded-For, needed by the rate limits (ADR 015)
server.forward-headers-strategy=native
